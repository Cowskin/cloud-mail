# LOCAL ONLY. No production account IDs, domains, schedules, AI, or live credentials.
name = "cloudmail-local-test"
main = "src/index.js"
compatibility_date = "2025-06-04"

[[d1_databases]]
binding = "db"
database_name = "cloudmail-local-test"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "kv"
id = "00000000000000000000000000000000"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
domain = ["example.test"]
admin = "admin@example.test"
jwt_secret = "LOCAL-TEST-ONLY-NOT-A-PRODUCTION-SECRET"
CARD_PROTECTION_SECRET = "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
analysis_cache = false
orm_log = false
