name: Verify Cloud Mail
on:
  push:
    branches: [main, 'maintenance/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
        working-directory: mail-worker
      - run: pnpm test
        working-directory: mail-worker
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: mail-vue
# Local AI/CLI is the only production release entry. CI never deploys or uses cloud credentials.
